---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:develop
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./freqtrade/rpc/api_server/ui/installed:/freqtrade/freqtrade/rpc/api_server/ui/installed"
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy KoreanStarterStrategy

  # Profile for running quick backtests via docker compose
  backtest:
    image: freqtradeorg/freqtrade:develop
    profiles: ["tools"]
    volumes:
      - "./user_data:/freqtrade/user_data"
    env_file:
      - path: .env
        required: false
    command: >
      backtesting
      --config /freqtrade/user_data/config.json
      --strategy KoreanStarterStrategy
      --timerange 20260101-

  # Profile for downloading historical market data via docker compose
  download-data:
    image: freqtradeorg/freqtrade:develop
    profiles: ["tools"]
    volumes:
      - "./user_data:/freqtrade/user_data"
    command: >
      download-data
      --config /freqtrade/user_data/config.json
      --timeframes 5m 15m 1h
      --days 30
